name: Pull Request Guard

on:
  pull_request:
    branches:
      - main
      - develop
      - release
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout EGK
        uses: actions/checkout@v7

      - name: grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Cache Gradle packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/gradle.properties
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-35"

      - name: Create gradle.properties
        run: |
          mkdir -p ~/.gradle
          echo "nvdApiKey=${{ secrets.NVD_API_KEY }}" >> ~/.gradle/gradle.properties
          echo "org.gradle.internal.publish.checksums.insecure=true" >> ~/.gradle/gradle.properties

      - name: Run tests
        run: |
          ./gradlew :egk:test

      - name: Run detekt
        run: |
          ./gradlew :egk:detekt

      - name: Run spotless
        run: |
          ./gradlew :egk:spotlessCheck

      - name: Run lint
        run: |
          ./gradlew :egk:lintRelease

      - name: Run build
        run: |
          ./gradlew :egk:build

      - name: Upload Lint Report
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: egk/build/reports/lint-results-release.html
