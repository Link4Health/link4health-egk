name: Release

# Pushing tag v<sdkVersion> releases this version: build, publish to Artifact Registry, GitHub release.
# Run scripts/release.sh in the framework repo instead of tagging by hand; see RELEASING.md there.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write  # Google Cloud workload identity federation

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout EGK
        uses: actions/checkout@v7

      - name: Check tag matches sdkVersion
        run: |
          version="$(sed -n 's/^sdkVersion=//p' gradle.properties | tr -d '\r')"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match sdkVersion=$version in gradle.properties"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" 'index($0, "## [" v "]") == 1 { found = 1; next } found && /^## \[/ { exit } found { print }' CHANGELOG.md > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section"
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35'

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          project_id: ${{ vars.ARTIFACT_GOOGLE_PROJECT }}
          workload_identity_provider: ${{ vars.ARTIFACT_GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.ARTIFACT_GOOGLE_SERVICE_ACCOUNT }}

      - name: Create gradle.properties
        env:
          GAR_URL: https://${{ vars.ARTIFACT_REGISTRY_LOCATION }}-maven.pkg.dev/${{ vars.ARTIFACT_GOOGLE_PROJECT }}/${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}
          GAR_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          mkdir -p ~/.gradle
          printf '%s\n' \
            "googleArtifactRegistryUrl=$GAR_URL" \
            "googleArtifactRegistryAccessToken=$GAR_ACCESS_TOKEN" \
            "org.gradle.internal.publish.checksums.insecure=true" \
            > ~/.gradle/gradle.properties

      - name: Test and build
        run: ./gradlew clean :egk:test :egk:assembleRelease

      - name: Publish to Artifact Registry
        run: ./gradlew :egk:publishLink4HealthEgkLibraryPublicationToGoogleArtifactRegistryRepository

      - name: Create GitHub release
        run: |
          prerelease=()
          [[ "$VERSION" == *-* ]] && prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md "${prerelease[@]}" egk/build/outputs/aar/*.aar

      - name: Remove temporary Gradle credentials
        if: always()
        run: rm -f ~/.gradle/gradle.properties
