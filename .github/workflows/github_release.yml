name: Create GitHub Release

# Creates the git tag and GitHub release only. Nothing is built or published.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create (defaults to v<version> from gradle.properties)'
        required: false
      overwrite:
        description: 'Replace the tag and release if they already exist'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: "github-release"
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Egk library
        uses: actions/checkout@v7

      - name: Resolve tag
        env:
          # Kept out of the script body: a dispatch input must never be interpolated into shell.
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          prop() { sed -n "s/^[[:space:]]*$1[[:space:]]*=[[:space:]]*//p" gradle.properties | tr -d '\r'; }
          version="$(prop majorEgkAndroid).$(prop minorEgkAndroid).$(prop patchEgkAndroid)"
          preRelease="$(prop preReleaseEgkAndroid)"
          if [[ -n "$preRelease" ]]; then
            version="$version-$preRelease"
          fi
          tag="${DISPATCH_TAG:-v$version}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9._-]+)?$ ]]; then
            echo "::error::Tag '$tag' must look like v<major>.<minor>.<patch>[-qualifier]"
            exit 1
          fi
          if ! head -n 1 RELEASENOTES.md | grep -qxF "# $version"; then
            echo "::warning::RELEASENOTES.md does not start with '# $version'"
          fi
          echo "Version: $version, tag: $tag"
          echo "TAG_NAME=$tag" >> "$GITHUB_ENV"

      - name: Check for existing tag
        env:
          OVERWRITE: ${{ inputs.overwrite }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG_NAME" > /dev/null; then
            if [[ "$OVERWRITE" != "true" ]]; then
              echo "::error::Tag $TAG_NAME already exists; rerun with 'overwrite' to replace it"
              exit 1
            fi
            gh release delete "$TAG_NAME" --yes || echo "No release for $TAG_NAME to delete"
          fi

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -fa "$TAG_NAME" -m "Release $TAG_NAME"
          git push --force origin "refs/tags/$TAG_NAME"

      - name: Create release
        run: |
          gh release create "$TAG_NAME" --verify-tag --title "$TAG_NAME" --notes-file RELEASENOTES.md --prerelease
